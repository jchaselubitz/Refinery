[package]
name = "refinery"
version = "0.2609010916.0"
edition = "2021"
rust-version = "1.85"
description = "Local prompt refinement service: turns transcripts, repository context, and media into validated prompts."
license = "UNLICENSED"
publish = false

[[bin]]
name = "refinery"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
ignore = "0.4"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "process"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
todo = "warn"

# rustc's debuginfo strip leaves proc-macro dylibs with a 4-byte-aligned
# LINKEDIT string pool. macOS 27 dyld rejects those images, so `sqlx` (and
# any other proc-macro) fails to load during a release build.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"
